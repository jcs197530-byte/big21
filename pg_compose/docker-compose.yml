#docker-com.ym 
services:
  web:
    image: nginx:latest
    container_name: web_server
    ports:
      - "8080:8080"
    volumes:
      - ./html:/usr/share/engix/html
    depends_on:
      - db
  db:
    image: postgres:16
    container_name: pg_test
    ports: 
      - "5555:5432"

    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_USER=appuser      
      - POSTGRES_DB=appdb
    volumes : 
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: